# Local verification stack for safeauth. NOT a production config.
# Real Supabase Postgres + real Supabase Auth (GoTrue) + PostgREST on loopback ports.
# Kakao is replaced by tests/stack/mock-kakao.mjs through the provider URL
# override that GoTrue's Kakao provider supports (GOTRUE_EXTERNAL_KAKAO_URL).
# All secrets come from the runtime env file generated by stack.mjs (gitignored).
name: safeauth-local

services:
  db:
    image: supabase/postgres:17.6.1.011
    network_mode: host
    environment:
      POSTGRES_PASSWORD: ${SAFEAUTH_PG_PASSWORD:?generated by stack.mjs}
      PGPORT: "54432"
      POSTGRES_PORT: "54432"
      JWT_SECRET: ${SAFEAUTH_JWT_SECRET:?generated by stack.mjs}
    command: ["postgres", "-D", "/etc/postgresql", "-c", "listen_addresses=127.0.0.1", "-c", "port=54432"]

  auth:
    image: supabase/gotrue:v2.197.0
    network_mode: host
    depends_on: [db]
    restart: on-failure
    environment:
      GOTRUE_API_HOST: 127.0.0.1
      PORT: "54499"
      API_EXTERNAL_URL: http://127.0.0.1:54400/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${SAFEAUTH_PG_PASSWORD}@127.0.0.1:54432/postgres
      GOTRUE_SITE_URL: http://127.0.0.1:8490/
      GOTRUE_URI_ALLOW_LIST: http://127.0.0.1:8480/callback.html,http://127.0.0.1:8481/sub/callback.html,com.fentanest.mysafetyreport://auth/callback
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_SECRET: ${SAFEAUTH_JWT_SECRET}
      GOTRUE_JWT_EXP: ${SAFEAUTH_JWT_EXP:-3600}
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_ISSUER: http://127.0.0.1:54400/auth/v1
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: "true"
      GOTRUE_SECURITY_REFRESH_TOKEN_REUSE_INTERVAL: "10"
      GOTRUE_EXTERNAL_KAKAO_ENABLED: "true"
      GOTRUE_EXTERNAL_KAKAO_CLIENT_ID: mock-kakao-client
      GOTRUE_EXTERNAL_KAKAO_SECRET: ${SAFEAUTH_KAKAO_SECRET:?generated by stack.mjs}
      GOTRUE_EXTERNAL_KAKAO_REDIRECT_URI: http://127.0.0.1:54400/auth/v1/callback
      GOTRUE_EXTERNAL_KAKAO_URL: http://127.0.0.1:54410
      GOTRUE_EXTERNAL_KAKAO_EMAIL_OPTIONAL: "true"
      GOTRUE_LOG_LEVEL: info

  rest:
    image: postgrest/postgrest:v13.0.7
    network_mode: host
    depends_on: [db]
    restart: on-failure
    environment:
      PGRST_DB_URI: postgres://authenticator:${SAFEAUTH_PG_PASSWORD}@127.0.0.1:54432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${SAFEAUTH_JWT_SECRET}
      PGRST_SERVER_HOST: 127.0.0.1
      PGRST_SERVER_PORT: "54498"
